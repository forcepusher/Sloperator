<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Dots</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 480px;
    height: 360px;
    overflow: hidden;
    background: #111418;
  }

  .stage {
    width: 480px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
  }

  .dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #4fc3f7;
    animation: bounce 2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  /* Negative delays keep the loop strictly periodic (seamless) while
     still starting with all dots at rest, then bouncing in sequence. */
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: -0.667s; }
  .dot:nth-child(3) { animation-delay: -1.333s; }

  @keyframes bounce {
    0%   { transform: translateY(0); }
    16%  { transform: translateY(-64px); }
    33%  { transform: translateY(0); }
    100% { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
